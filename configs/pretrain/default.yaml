# Self-supervised pretraining 설정
data_config: configs/data/default.yaml

model:
  d_model: 128
  n_heads: 4
  n_layers: 4
  d_ff: 256
  dropout: 0.1

ssl:
  strategy: "masked_reconstruction"   # masked_reconstruction | contrastive
  mask_mode: "mixed"                   # segment | channel | mixed
  segment_prob: 0.7                    # mixed 모드에서 segment 방식 선택 확률 (나머지는 channel)

  # Curriculum mask ratio: epoch 진행에 따라 start → end 선형 증가
  # pretrain_methodology.md §1: 처음엔 쉬운 과제로 시작해 점점 어렵게
  mask_ratio_start: 0.15
  mask_ratio_end: 0.40
  curriculum_epochs: 50               # 이 epoch까지 선형 증가, 이후 end 고정

  # Forecasting 보조 objective
  forecast_loss_weight: 0.15          # L_pretrain = L_mask + 0.15 * L_forecast
  mask_guard_tail: 8                  # 마지막 8 timestep은 마스킹 후보에서 제외 (forecasting anchor 보호)

train:
  epochs: 100
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 1.0e-5
  warmup_steps: 500
  ckpt_dir: checkpoints/pretrain
  log_dir: logs/pretrain
