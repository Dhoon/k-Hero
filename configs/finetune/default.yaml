# 이상탐지 파인튜닝 설정
data_config: configs/data/default.yaml
encoder_ckpt: checkpoints/pretrain/best.pt

freeze_encoder: false     # true면 encoder 고정, head만 학습

# 실측 고장 레이블이 없으므로 reconstruction 기반 비지도 이상탐지로 진행
head:
  type: "reconstruction"   # reconstruction | classification (레이블 확보 시 전환 가능)
  threshold_method: "percentile"   # percentile | k_sigma
  threshold_value: 99.0

train:
  epochs: 50
  batch_size: 128
  lr: 5.0e-4
  weight_decay: 1.0e-5
  ckpt_dir: checkpoints/finetune
  log_dir: logs/finetune

eval:
  # 실측 레이블이 없어 configs/eval/synthetic.yaml 로 생성한 합성 이상치 검증셋 기준으로 계산
  synthetic_eval_config: configs/eval/synthetic.yaml
  metrics: ["auroc", "auprc", "f1", "precision_at_k"]
