seed: 42
data_config: configs/data/default.yaml
pretrain_ckpt: checkpoints/pretrain_lstm/best.pt
downstream_dir: data/processed/downstream
output_dir: outputs/scores_lstm
figure_dir: outputs/figures_lstm

model:
  hidden_dim: 64
  num_layers: 2

detection:
  hidden_dim: 32
  dropout: 0.1
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 256
  warmup_steps: 0
  ckpt_dir: checkpoints/downstream_lstm
  log_dir: logs/downstream_lstm

classification:
  hidden_dim: 32
  dropout: 0.1
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 256
  warmup_steps: 0
  ckpt_dir: checkpoints/downstream_lstm
  log_dir: logs/downstream_lstm
