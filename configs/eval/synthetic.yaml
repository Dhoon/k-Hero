# 합성 이상치 주입 설정 (레이블이 없는 데이터에서 파이프라인 검증용)
# 정상 데이터(주로 test split)에 인위적으로 이상 패턴을 주입하고,
# 주입 위치를 정답 레이블 삼아 auroc/auprc/f1/precision_at_k 등을 계산한다.

source_split: "test"                 # 어느 split에 주입할지 (정상 위주 구간)
output_dir: data/processed/synthetic_eval
seed: 42

injection_ratio: 0.1                  # 전체 윈도우 중 이상치를 주입할 비율

anomaly_types:
  - type: "spike"                     # 순간적으로 값이 크게 튐
    prob: 0.3
    magnitude_std: [3, 6]              # 정상 구간 std의 몇 배로 튈지 (범위 내 랜덤)
    duration_steps: [1, 2]

  - type: "drop"                       # 순간적으로 값이 크게 떨어짐 (spike의 반대)
    prob: 0.2
    magnitude_std: [3, 6]
    duration_steps: [1, 2]

  - type: "flatline"                   # 센서 고착 (값이 일정 구간 동안 안 변함) - 계량기 통신 오류 등 흉내
    prob: 0.2
    duration_steps: [4, 12]             # 96스텝 윈도우 기준 1~3시간 정도

  - type: "drift"                       # 완만하게 값이 밀려 올라가거나 내려감 (센서 캘리브레이션 이슈 등)
    prob: 0.2
    magnitude_std: [2, 4]
    duration_steps: [12, 48]

  - type: "trend_break"                  # 정상적인 일간 주기 패턴이 갑자기 깨짐 (다른 시간대 패턴을 붙여넣기 등)
    prob: 0.1
    duration_steps: [24, 96]
