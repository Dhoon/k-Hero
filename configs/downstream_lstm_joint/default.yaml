seed: 42
data_config: configs/data/default.yaml
pretrain_ckpt: checkpoints/pretrain_lstm/best.pt
downstream_dir: data/processed/downstream
output_dir: outputs/scores_lstm_joint
figure_dir: outputs/figures_lstm_joint

model:
  hidden_dim: 64
  num_layers: 2

training:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  batch_size: 256
  warmup_steps: 0
  w_det: 1.0    # detection loss weight
  w_cls: 0.4    # classification loss weight
  ckpt_dir: checkpoints/downstream_lstm/joint
  log_dir: logs/downstream_lstm_joint

heads:
  hidden_dim: 32
  dropout: 0.1
